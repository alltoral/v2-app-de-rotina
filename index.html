<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2E205">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Dia">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Meu Dia — ALLTORAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg-page:#141116;
    --yellow:#F2E205;
    --black:#141116;
    --white:#FFFFFF;
    --pink:#EC1E8C;
    --gray-label:#9C9895;
    --paper-shadow: 0 8px 18px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.3);
  }
  *{box-sizing:border-box;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    background:var(--bg-page);
    font-family:'Archivo',sans-serif;
    color:var(--white);
    overscroll-behavior-y:contain;
    -webkit-tap-highlight-color:transparent;
  }
  .app{
    max-width:1200px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg-page);
    position:relative;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }

  /* HEADER */
  .header{
    background:var(--yellow);
    width:100vw;
    margin-left:calc(50% - 50vw);
    position:relative;
    overflow:hidden;
    border-bottom:3px solid var(--black);
  }
  .header::after{
    content:"";
    position:absolute; inset:0;
    background-image: radial-gradient(circle, rgba(26,26,26,0.10) 1.5px, transparent 1.5px);
    background-size: 16px 16px;
    opacity:0.5;
    pointer-events:none;
  }
  .header-inner{
    max-width:1200px;
    margin:0 auto;
    padding:28px 28px 22px;
    position:relative;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--black);
    opacity:0.65;
    font-weight:700;
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    display:inline-block;
    width:22px; height:2px;
    background:var(--black);
    opacity:0.7;
  }
  .title-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
    position:relative;
  }
  h1{
    font-family:'DM Serif Display',serif;
    font-weight:700;
    font-size:44px;
    margin:6px 0 0;
    color:var(--black);
  }
  .accent-script{
    font-style:italic;
    color:var(--pink);
  }
  .subtitle{
    display:block;
    font-family:'Archivo',sans-serif;
    font-style:italic;
    color:var(--black);
    opacity:0.55;
    font-size:14px;
    margin-top:2px;
  }

  /* TOOLBAR / WEEK NAV */
  .toolbar{
    display:flex;
    gap:10px;
    padding:16px 28px;
    flex-wrap:wrap;
    align-items:center;
    background:var(--bg-page);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  button{
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    border:2px solid transparent;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease;
  }
  button:active{ transform:scale(0.95); }
  .btn-nav{
    background:transparent;
    color:var(--white);
    border:2px solid rgba(255,255,255,0.3);
    padding:8px 14px;
    font-size:16px;
    line-height:1;
  }
  .btn-nav:hover{ border-color:rgba(255,255,255,0.6); }
  .btn-today{
    background:transparent;
    color:var(--gray-label);
    border:2px solid rgba(255,255,255,0.2);
    padding:8px 14px;
    font-size:11px;
  }
  .btn-today:hover{ color:var(--white); border-color:rgba(255,255,255,0.5); }
  .week-label{
    font-family:'DM Serif Display',serif;
    font-style:italic;
    color:var(--pink);
    font-size:18px;
    padding:0 4px;
    white-space:nowrap;
  }
  .toolbar-spacer{ flex:1; min-width:8px; }
  .offline-badge{
    display:none;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.3px;
    color:var(--black);
    background:var(--yellow);
    padding:5px 10px;
    border-radius:6px;
  }
  .offline-badge.show{ display:inline-block; }
  .btn-sync{ background:transparent; color:var(--white); border:2px solid rgba(255,255,255,0.35); }
  .btn-sync:hover{ border-color:rgba(255,255,255,0.7); }
  .btn-sync[disabled]{ opacity:0.5; cursor:wait; }
  .sync-status{
    font-size:12px;
    color:var(--gray-label);
    font-style:italic;
  }

  /* WEEK BOARD */
  .board-wrap{
    padding:20px 28px 40px;
  }
  .week-board{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    padding-bottom:6px;
  }
  .day-card{
    background:var(--white);
    border-radius:14px;
    min-width:160px;
    flex:1 1 160px;
    display:flex;
    flex-direction:column;
    scroll-snap-align:start;
    box-shadow:var(--paper-shadow);
    max-height:calc(100vh - 230px);
    overflow:hidden;
  }
  .day-header{
    padding:12px 14px 10px;
    border-bottom:2px solid rgba(20,17,22,0.08);
    flex-shrink:0;
  }
  .day-card.today .day-header{
    background:var(--yellow);
  }
  .day-name{
    display:block;
    font-size:10.5px;
    letter-spacing:1px;
    font-weight:700;
    color:#8A8680;
    text-transform:uppercase;
  }
  .day-card.today .day-name{ color:rgba(20,17,22,0.65); }
  .day-num{
    font-family:'DM Serif Display',serif;
    font-size:24px;
    color:var(--black);
  }
  .task-list{
    flex:1;
    overflow-y:auto;
    padding:8px 10px;
    display:flex;
    flex-direction:column;
    gap:4px;
    min-height:60px;
  }
  .task-item{
    display:flex;
    align-items:flex-start;
    gap:8px;
    padding:6px 4px;
    border-radius:6px;
  }
  .task-item:hover{ background:rgba(20,17,22,0.05); }
  .task-check{
    width:18px; height:18px;
    border-radius:5px;
    border:2px solid var(--black);
    background:var(--white);
    flex-shrink:0;
    margin-top:2px;
    cursor:pointer;
    padding:0;
    position:relative;
  }
  .task-item.done .task-check{ background:var(--pink); border-color:var(--pink); }
  .task-item.done .task-check::after{
    content:"✓";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--white);
    font-size:12px;
    line-height:1;
  }
  .task-text{
    flex:1;
    font-size:13.5px;
    font-weight:500;
    color:var(--black);
    outline:none;
    word-break:break-word;
    line-height:1.35;
    padding-top:1px;
  }
  .task-item.done .task-text{ text-decoration:line-through; opacity:0.4; }
  .task-item.from-calendar{ border-left:3px solid var(--yellow); padding-left:5px; }
  .task-close{
    font-size:13px;
    color:rgba(20,17,22,0.3);
    cursor:pointer;
    display:none;
    flex-shrink:0;
    padding:0 2px;
  }
  .task-item:hover .task-close{ display:block; }
  .add-task-row{
    padding:8px 8px 12px 12px;
    border-top:1px dashed rgba(20,17,22,0.12);
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .add-task-input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-family:'Archivo',sans-serif;
    font-size:13px;
    color:var(--black);
    outline:none;
  }
  .add-task-input::placeholder{ color:#B7B2AC; }
  .add-task-confirm{
    flex-shrink:0;
    width:24px; height:24px;
    padding:0;
    border-radius:6px;
    border:none;
    background:transparent;
    color:var(--black);
    opacity:0.35;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .add-task-confirm svg{ width:16px; height:16px; }
  .add-task-confirm:hover{ opacity:0.7; }
  .add-task-confirm:active{ transform:scale(0.9); }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.2); border-radius:4px; }

  @media (max-width:600px){
    .header-inner{ padding:calc(16px + env(safe-area-inset-top)) 18px 16px; }
    .eyebrow{ font-size:9px; gap:6px; }
    .eyebrow::before{ width:14px; }
    h1{ font-size:28px; margin-top:4px; }
    .subtitle{ font-size:12px; }

    .toolbar{ padding:10px 14px; gap:6px; }
    .week-label{ font-size:14px; }
    .btn-sync{ padding:10px 14px; font-size:10px; }
    .sync-status{ font-size:10px; width:100%; }

    .board-wrap{ padding:12px 10px 24px; }
    .day-card{ min-width:132px; flex:1 1 132px; max-height:calc(100vh - 210px); }
    .day-num{ font-size:20px; }
    .task-text{ font-size:12.5px; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-inner">
      <span class="eyebrow">ALLTORAL · organização diária</span>
      <div class="title-row">
        <h1>Meu <span class="accent-script">Dia</span></h1>
      </div>
      <span class="subtitle">tudo colado, nada esquecido.</span>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-nav" id="prevWeekBtn" aria-label="Semana anterior">‹</button>
    <span class="week-label" id="weekLabel"></span>
    <button class="btn-nav" id="nextWeekBtn" aria-label="Próxima semana">›</button>
    <button class="btn-today" id="todayBtn">hoje</button>
    <span class="offline-badge" id="offlineBadge">offline — salvando neste aparelho</span>
    <div class="toolbar-spacer"></div>
    <button class="btn-sync" id="syncBtn">sincronizar com Google Agenda</button>
    <span class="sync-status" id="syncStatus"></span>
  </div>

  <div class="board-wrap">
    <div class="week-board" id="weekBoard"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { initializeFirestore, persistentLocalCache, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// ====== COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO FIREBASE ======
// Veja o LEIA-ME.md para o passo a passo (gratuito, sem cartão de crédito).
const firebaseConfig = {
  apiKey: "AIzaSyD7mMloHeHaEbkey32blc1S_aMPkVbneIE",
  authDomain: "meudia-alltoral.firebaseapp.com",
  projectId: "meudia-alltoral",
  storageBucket: "meudia-alltoral.firebasestorage.app",
  messagingSenderId: "123897237690",
  appId: "1:123897237690:web:e1e76db43e4f9a6d1db283"
};
// ================================================================

// ====== COLE AQUI O CLIENT ID DO GOOGLE CLOUD (para sincronizar a Agenda) ======
// Veja o LEIA-ME.md, seção "Google Agenda", para o passo a passo.
const GOOGLE_CLIENT_ID = "123897237690-597ledi4udri7f5oucjts1sa3hmhb118.apps.googleusercontent.com";
// ================================================================

let db = null;
try {
  if (firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('COLE_') !== 0) {
    const app = initializeApp(firebaseConfig);
    db = initializeFirestore(app, { localCache: persistentLocalCache(/*settings*/{}) });
  }
} catch (err) {
  console.warn('Firebase não inicializou:', err);
}
(function(){
  const WEEKDAY_LABELS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

  // Fixed board code: this is a personal single-user app, so every device
  // should automatically share the same board with zero setup — no code to
  // type in anywhere.
  const boardCode = 'alltoral-meudia';

  function dateKey(d){
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return y + '-' + m + '-' + day;
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function isSameDate(a, b){ return dateKey(a) === dateKey(b); }
  function startOfWeek(d){
    const day = d.getDay(); // 0=Sun..6=Sat
    const diff = (day === 0 ? -6 : 1 - day); // shift back to Monday
    const monday = addDays(d, diff);
    monday.setHours(0,0,0,0);
    return monday;
  }
  function weekDates(weekStart){
    const arr = [];
    for(let i=0;i<7;i++) arr.push(addDays(weekStart, i));
    return arr;
  }
  function localKey(dk){ return 'tasks:' + boardCode + ':' + dk; }
  function pad2(n){ return n.toString().padStart(2,'0'); }

  let currentWeekStart = startOfWeek(new Date());
  const tasksByDate = {};
  const unsubs = {};
  const saveTimers = {};

  const weekBoard = document.getElementById('weekBoard');
  const weekLabel = document.getElementById('weekLabel');
  const prevWeekBtn = document.getElementById('prevWeekBtn');
  const nextWeekBtn = document.getElementById('nextWeekBtn');
  const todayBtn = document.getElementById('todayBtn');
  const syncBtn = document.getElementById('syncBtn');
  const syncStatus = document.getElementById('syncStatus');

  function updateWeekLabel(dates){
    const fmt = (d)=> d.getDate() + ' ' + d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
    weekLabel.textContent = fmt(dates[0]) + ' – ' + fmt(dates[6]);
  }

  function addTask(dk, text){
    if(!tasksByDate[dk]) tasksByDate[dk] = [];
    tasksByDate[dk].push({
      id: 't' + Date.now() + Math.random().toString(36).slice(2,6),
      text: text,
      done: false
    });
    renderDay(dk);
    save(dk);
  }

  function makeTaskEl(dk, task){
    const el = document.createElement('div');
    el.className = 'task-item' + (task.done ? ' done' : '') + (task.fromCalendar ? ' from-calendar' : '');
    el.dataset.id = task.id;

    const check = document.createElement('button');
    check.className = 'task-check';
    check.addEventListener('click', ()=>{
      task.done = !task.done;
      renderDay(dk);
      save(dk);
    });
    el.appendChild(check);

    const text = document.createElement('div');
    text.className = 'task-text';
    text.contentEditable = 'true';
    text.textContent = task.text;
    text.addEventListener('blur', ()=>{ task.text = text.textContent; save(dk); });
    el.appendChild(text);

    const close = document.createElement('span');
    close.className = 'task-close';
    close.textContent = '×';
    close.addEventListener('click', (e)=>{
      e.stopPropagation();
      tasksByDate[dk] = (tasksByDate[dk]||[]).filter(t=>t.id!==task.id);
      renderDay(dk);
      save(dk);
    });
    el.appendChild(close);

    return el;
  }

  function renderDay(dk){
    const list = document.getElementById('list-' + dk);
    if(!list) return;
    list.innerHTML = '';
    (tasksByDate[dk] || []).forEach(task=>{
      list.appendChild(makeTaskEl(dk, task));
    });
  }

  function buildWeek(){
    weekBoard.innerHTML = '';
    const dates = weekDates(currentWeekStart);
    const today = new Date();

    dates.forEach(d=>{
      const dk = dateKey(d);
      if(!(dk in tasksByDate)) tasksByDate[dk] = [];

      const card = document.createElement('div');
      card.className = 'day-card' + (isSameDate(d, today) ? ' today' : '');
      card.dataset.date = dk;

      const header = document.createElement('div');
      header.className = 'day-header';
      const nameEl = document.createElement('span');
      nameEl.className = 'day-name';
      nameEl.textContent = WEEKDAY_LABELS[d.getDay()];
      const numEl = document.createElement('span');
      numEl.className = 'day-num';
      numEl.textContent = ' ' + d.getDate();
      header.appendChild(nameEl);
      header.appendChild(numEl);
      card.appendChild(header);

      const list = document.createElement('div');
      list.className = 'task-list';
      list.id = 'list-' + dk;
      card.appendChild(list);

      const addRow = document.createElement('div');
      addRow.className = 'add-task-row';
      const input = document.createElement('input');
      input.className = 'add-task-input';
      input.placeholder = '+ tarefa';
      input.setAttribute('enterkeyhint', 'done');
      input.setAttribute('autocomplete', 'off');
      function submitInput(){
        if(input.value.trim()){
          addTask(dk, input.value.trim());
          input.value = '';
        }
      }
      input.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          submitInput();
        }
      });
      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'add-task-confirm';
      confirmBtn.type = 'button';
      confirmBtn.setAttribute('aria-label', 'Adicionar tarefa');
      confirmBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 5v5a3 3 0 0 1-3 3H5m0 0 4-4M5 13l4 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      confirmBtn.addEventListener('click', submitInput);
      addRow.appendChild(input);
      addRow.appendChild(confirmBtn);
      card.appendChild(addRow);

      weekBoard.appendChild(card);
    });

    dates.forEach(d=> renderDay(dateKey(d)));
    updateWeekLabel(dates);
  }

  function loadLocal(dk){
    let raw = null;
    try{ raw = localStorage.getItem(localKey(dk)); }catch(err){}
    if(raw){
      try{ tasksByDate[dk] = JSON.parse(raw); }catch(err){}
    } else if(!tasksByDate[dk]){
      tasksByDate[dk] = [];
    }
    renderDay(dk);
  }

  function subscribeDate(dk){
    if(unsubs[dk]){ unsubs[dk](); delete unsubs[dk]; }
    if(db){
      const ref = doc(db, 'boards', boardCode + '_' + dk);
      unsubs[dk] = onSnapshot(ref, (snap)=>{
        if(snap.exists()){
          const data = snap.data();
          if(Array.isArray(data.tasks)) tasksByDate[dk] = data.tasks;
        } else if(!tasksByDate[dk]){
          tasksByDate[dk] = [];
        }
        renderDay(dk);
      }, (err)=>{
        console.warn('Firestore erro', err);
        loadLocal(dk);
      });
    } else {
      loadLocal(dk);
    }
  }

  function save(dk){
    const payload = JSON.stringify(tasksByDate[dk] || []);
    try{ localStorage.setItem(localKey(dk), payload); }catch(err){}
    if(window.storage && typeof window.storage.set === 'function'){
      window.storage.set(localKey(dk), payload).catch(()=>{});
    }
    clearTimeout(saveTimers[dk]);
    saveTimers[dk] = setTimeout(()=> pushToCloud(dk), 300);
  }

  async function pushToCloud(dk){
    if(!db) return;
    try{
      const ref = doc(db, 'boards', boardCode + '_' + dk);
      await setDoc(ref, { tasks: tasksByDate[dk] || [], updatedAt: Date.now() });
    }catch(err){
      console.warn('erro ao salvar na nuvem', err);
    }
  }

  function switchWeek(){
    Object.keys(unsubs).forEach(k=>{ unsubs[k](); delete unsubs[k]; });
    buildWeek();
    weekDates(currentWeekStart).forEach(d=> subscribeDate(dateKey(d)));
  }

  prevWeekBtn.addEventListener('click', ()=>{ currentWeekStart = addDays(currentWeekStart, -7); switchWeek(); });
  nextWeekBtn.addEventListener('click', ()=>{ currentWeekStart = addDays(currentWeekStart, 7); switchWeek(); });
  todayBtn.addEventListener('click', ()=>{ currentWeekStart = startOfWeek(new Date()); switchWeek(); });

  let googleAccessToken = null;

  function getGoogleAccessToken(forceConsent){
    return new Promise((resolve, reject)=>{
      if(GOOGLE_CLIENT_ID.indexOf('COLE_') === 0){
        reject(new Error('missing-client-id'));
        return;
      }
      if(typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2){
        reject(new Error('gis-not-loaded'));
        return;
      }
      const client = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/calendar.readonly',
        callback: (resp)=>{
          if(resp.error){ reject(new Error(resp.error)); return; }
          googleAccessToken = resp.access_token;
          resolve(googleAccessToken);
        }
      });
      client.requestAccessToken({ prompt: forceConsent ? 'consent' : '' });
    });
  }

  syncBtn.addEventListener('click', async ()=>{
    syncBtn.disabled = true;
    syncStatus.textContent = 'conectando com sua conta Google...';
    try{
      const token = await getGoogleAccessToken(!googleAccessToken);
      syncStatus.textContent = 'buscando eventos da semana...';

      const dates = weekDates(currentWeekStart);
      const rangeStart = new Date(dates[0]); rangeStart.setHours(0,0,0,0);
      const rangeEnd = new Date(dates[6]); rangeEnd.setHours(23,59,59,999);
      const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
        + '?timeMin=' + encodeURIComponent(rangeStart.toISOString())
        + '&timeMax=' + encodeURIComponent(rangeEnd.toISOString())
        + '&singleEvents=true&orderBy=startTime';

      let res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
      if(res.status === 401){
        const fresh = await getGoogleAccessToken(true);
        res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + fresh } });
      }
      if(!res.ok) throw new Error('http-' + res.status);

      const data = await res.json();
      const grouped = {};
      (data.items || []).forEach(item=>{
        if(!item.start || !item.start.dateTime) return; // skip all-day events
        const start = new Date(item.start.dateTime);
        const dk = dateKey(start);
        if(!grouped[dk]) grouped[dk] = [];
        grouped[dk].push({
          id: 'g' + (item.id || Math.random().toString(36).slice(2)),
          text: pad2(start.getHours()) + ':' + pad2(start.getMinutes()) + ' ' + (item.summary || '(sem título)'),
          done: false,
          fromCalendar: true
        });
      });

      let total = 0;
      Object.keys(grouped).forEach(dk=>{
        const kept = (tasksByDate[dk] || []).filter(t=>!t.fromCalendar);
        tasksByDate[dk] = kept.concat(grouped[dk]);
        total += grouped[dk].length;
        renderDay(dk);
        save(dk);
      });

      syncStatus.textContent = total ? total + ' evento(s) da semana carregados' : 'nenhum evento essa semana 🎉';
    }catch(err){
      console.error(err);
      if(err.message === 'missing-client-id'){
        syncStatus.textContent = 'configure o Google Client ID (veja o LEIA-ME.md)';
      }else if(err.message === 'gis-not-loaded'){
        syncStatus.textContent = 'não consegui carregar o login do Google, tente recarregar a página';
      }else{
        syncStatus.textContent = 'não consegui conectar à agenda agora';
      }
    }finally{
      syncBtn.disabled = false;
    }
  });

  switchWeek();

  const offlineBadge = document.getElementById('offlineBadge');
  function updateOnlineStatus(){
    offlineBadge.classList.toggle('show', !navigator.onLine);
  }
  window.addEventListener('online', updateOnlineStatus);
  window.addEventListener('offline', updateOnlineStatus);
  updateOnlineStatus();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch((err)=>{
        console.warn('Service worker não registrou:', err);
      });
    });
  }
})();
</script>
</body>
</html>
